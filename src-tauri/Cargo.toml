[package]
name = "Argentum"
description = "A blazingly-fast, non-destructive, and GPU-accelerated RAW image editor built with performance in mind."
authors = ["Timon Käch"]
edition = "2024"
version = "26.41.13"
rust-version = "1.98"

[lib]
name = "argentum_lib"
# Argentum: desktop only - the binary links the rlib and nothing else is used.
# Their staticlib (iOS) and cdylib (Android) were written by every build, the
# staticlib alone 640 MB. A mobile build puts them back.
crate-type = ["rlib"]

[features]
default = []
tethering = ["dep:gphoto2"]

[dependencies]
tauri = { version = "2.12", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"
base64 = "0.23"
tauri-plugin-fs = "2.5.1"
rayon = "1.12.0"
blake3 = "1.8.7"
wgpu = "29.0" # Downgraded to prevent P3 color shifts on Apple devices
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
rawler = { git = "https://github.com/akhater/RapidRAW-DngLab.git", rev = "16b9b01068ac1f7a9b5319705a075ef6c7789d7a" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
walkdir = "2.5.0"
imageproc = "0.27.0"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
log = "0.4"
fern = "0.7"
little_exif = "0.6.23"
chrono = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = "0.11"
nalgebra = "0.35.0"
hex = "0.4"
rand = "0.10"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
mimalloc = "0.1.52"
# Argentum: mods/memory.rs asks the allocator for the process's memory and to
# hand freed pages back. Same crate mimalloc already builds, with its extended API.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
image_hasher = "3.1.1"
regex = "1.13.1"
memmap2 = "0.9.11"
half = { version = "2.7.1", features = ["bytemuck"] }
glam = "0.33.5"
quick-xml = { version = "0.41", features = ["serialize"] }
fuzzy-matcher = "0.3.7"
image-hdr = { version = "0.6.0", default-features = false }
mozjpeg-rs = "0.9.2"
webp = "0.3"
jxl-oxide = { version = "0.12.6", features = ["image"] }
jxl-encoder = "0.3.1"
filetime = "0.2"
libc = "0.2.189"
rgb = "0.8.53"
imgref = "1.12.2"
sysinfo = "0.39.6"
tauri-plugin-http = "2.8.0"
argentum-engine = { path = "engine" } # Argentum: the new engine, for the new interface (mods/engine_bridge.rs)

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
trash = "5.2.6"
tauri-plugin-single-instance = "2.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gphoto2 = { git = "https://github.com/CyberTimon/libgphoto2-rs", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSValue",
    "NSArray",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-core-image = { version = "0.3.2", features = [
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
include_dir = "0.7.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
hex = "0.4"

[profile.dev]
opt-level = 2
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
# Argentum: nor debug assertions in them — see mods/sraw_levels.rs.
debug-assertions = false
# Argentum: nor debug info - a PDB half the size, faster cold builds; backtraces keep names.
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
# Argentum: the display's colour profile (mods/display_monitor.rs) and the disks the folder column lists (mods/drives.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }
# Argentum: AI enlargement on the GPU — see mods/gpu_runtime.rs. Same ort as above,
# plus the DirectML entry point; flate2 unpacks the runtime from its NuGet package.
ort = { version = "=2.0.0-rc.10", features = ["directml"] }
flate2 = "1"
webview2-com = "0.39" # Argentum: frames to the new interface as WebView2 shared buffers - see mods/engine_frame.rs. Already built for Tauri's wry.
