[package]
name = "argentum-engine-reference"
description = "Today's app code, compiled verbatim outside the app: the yardstick the engine's parity tests measure against."
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# sharpen.rs names `tauri::AppHandle` in one function the tests never call.
tauri = { package = "argentum-engine-tauri-stub", path = "tauri-stub" }
rawler = { git = "https://github.com/akhater/RapidRAW-DngLab.git", rev = "16b9b01068ac1f7a9b5319705a075ef6c7789d7a" }
wgpu = "29.0"
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25.10", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
