[package]
name = "argentum-engine"
description = "Argentum's processing engine: a registry of tools and a pipeline that caches each tool's result."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# A workspace of its own. It builds and tests from this folder alone, without
# building the app; the app takes it as a path dependency.
[workspace]
# Today's app code compiled outside the app, for the parity tests. Not a member,
# so `cargo clippy` here lints the engine and not the app's files.
exclude = ["reference"]

[dependencies]
# The same pinned fork the app decodes with (src-tauri/Cargo.toml).
rawler = { git = "https://github.com/akhater/RapidRAW-DngLab.git", rev = "e865df57b7da0607e6c5c972c2a2ce47a486c2e3" }
# Unpacks the sensor data of the formats measured identical to rawler's,
# faster (src/flashraw.rs). Pinned: a new version is measured again first
# (npm run check:sources warns when one is out).
# Its sensor output only: no colour management, no JPEG XL, no GPU.
flashraw = { version = "=0.1.1", default-features = false, features = ["rayon", "simd"] }
wgpu = "29.0"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.12.0"
# Half floats: the pixel pass keeps its input on the GPU as the app keeps
# its own, rgba16float. The app's version (src-tauri/Cargo.toml).
half = { version = "2.7.1", features = ["bytemuck"] }
# The app's own (src-tauri/Cargo.toml): white balance's maths is copied as
# written, in glam's matrix types.
glam = "0.33.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The interface's TypeScript types, generated from src/contract.rs by
# tests/contract.rs. Only the tests turn it on (the "ts" feature, below).
ts-rs = { version = "10.1", features = ["no-serde-warnings"], optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
# The crate itself with the TypeScript derive on, for tests/contract.rs.
argentum-engine = { path = ".", features = ["ts"] }
argentum-engine-reference = { path = "reference" }
image = { version = "0.25.10", default-features = false }
# The parity tests read the app's shader struct layouts off its WGSL, through
# the WGSL front end wgpu already builds (the same naga, the same feature).
naga = { version = "29.0.4", features = ["wgsl-in"] }

# The app's own profile, so a test here runs at the speed the app's code does.
[profile.dev]
opt-level = 2
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
