name: Upstream

# What Argentum takes from other projects (scripts/check-sources.mjs), as a
# required check. Argentum was forked from RapidRAW at 1.6.6 and no longer
# merges it, so no history and no upstream remote are needed: the check fails
# only when wiring a feature depends on is gone, and warns when RapidRAW,
# RAWmakase or FlashRaw has a release to review. The job keeps its name because
# branch protection requires it by name.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  upstream:
    name: Mergeability and upstream review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the checks themselves
        run: npm run test:checks

      - name: Wiring, and releases to review
        run: npm run check:sources
