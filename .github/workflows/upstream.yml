name: Upstream

# The mergeability checks and the release-review register, as a required check.
#
# Without an upstream remote the checker skips and says so quietly - correct on
# a contributor's fresh clone, useless as a gate. So this job creates the
# prerequisites, and the checker fails, rather than skips, when CI is set and
# they are missing.
#
# fetch-depth: 0 is not optional. merge-base needs the whole history, the
# register names commits a shallow clone does not have, and the ratchet is
# compared with the baseline on origin/main. Their release tags are fetched
# too: each release review names the tag it reviewed up to.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  upstream:
    name: Mergeability and upstream review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/CyberTimon/RapidRAW.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main 'refs/tags/v*:refs/tags/v*'

      - name: Test the checks themselves
        run: npm run test:checks

      - name: Ratchet, coverage, anchors, integrity and release review
        run: node scripts/check-mergeability.mjs
