name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Every call the interface makes reaches a command, every shortcut a
      # handler; dependency counts and the built size against
      # scripts/wiring-baseline.json, so a removal or a new package shows.
      - name: Wiring, dependencies and size
        run: npm run check:wiring -- --dist

      - name: Tests
        run: npm run test:frontend

      # Today's interface in headless Chrome over a stub of the app: every
      # menu, tab, Settings section, context menu and default shortcut. Fails
      # on a page error, a raw translation key, or controls that differ from
      # scripts/ui-walk/ui-reachability.json.
      - name: UI walk
        run: npm run check:ui

      # Types, lint and formatting against scripts/frontend-baseline.json:
      # nothing may get worse than main already was.
      - name: Types, lint and formatting
        run: npm run check:frontend

      - name: Check Translation Sync
        run: npm run i18n:check
        continue-on-error: true

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ''
          rust-src-dir: src-tauri

      # Argentum's own modules only. Upstream's files are deliberately left
      # unformatted: rewrapping four of them added twenty to forty lines against
      # the per-file budgets that keep this fork mergeable, and that budget is
      # not there to be spent on whitespace.
      - name: Check formatting
        working-directory: src-tauri
        run: rustfmt --edition 2024 --check src/mods/*.rs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ''
          rust-src-dir: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgphoto2-dev

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
