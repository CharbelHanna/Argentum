name: Engine

# The engine crate (src-tauri/engine) is a workspace of its own, and nothing
# else in CI builds it. Its parity tests compile some of the app's files as
# they are (engine/reference), so a change to one of those files can stop the
# engine's tests compiling without touching the engine at all. This runs them
# on every push and pull request.
#
# The runner has no graphics card, so the tests run on Mesa's Vulkan driver for
# the CPU (lavapipe), as wgpu's own CI runs its GPU tests: the GPU parity tests
# hold the engine's copies of the app's shaders to the app's, and the memory
# budget counts what the engine allocates, which holds on any GPU. With
# AG_REQUIRE_GPU set, a test that finds no GPU fails rather than skipping.
# There are no test photos: the real-photo tests say they skipped and pass.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain from src-tauri/rust-toolchain.toml; the cache is the
      # engine's own workspace and target.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          rust-src-dir: src-tauri
          cache-workspaces: src-tauri/engine

      - name: Install a software GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Test
        working-directory: src-tauri/engine
        env:
          AG_REQUIRE_GPU: '1'
        run: cargo test
